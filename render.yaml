# Free preview only. The database expires after 30 days; do not store production data.
# Apply only after setting secrets and reviewing the two original migrations.
databases:
  - name: kirana-identity-preview
    databaseName: kirana_identity
    user: kirana
    plan: free
    region: singapore
    postgresMajorVersion: '17'
    # Temporarily allow only the operator's IP for reviewed external migrations,
    # then restore internal-only access. Never allow 0.0.0.0/0 for convenience.
    ipAllowList: []

services:
  - type: web
    name: kirana-backend-preview
    runtime: docker
    plan: free
    region: singapore
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /api/v1/health
    numInstances: 1
    maxShutdownDelaySeconds: 30
    # Free services have no pre-deploy commands or shell access.
    # Apply migrations once from a verified external target, not app startup.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          name: kirana-identity-preview
          property: connectionString
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_ISSUER
        value: kirana-identity
      - key: JWT_AUDIENCE
        value: kirana-api
      - key: MAIL_TRANSPORT
        value: resend
      - key: AUTH_EMAIL_MODE
        # No frontend is deployed yet; enter emailed codes in the documented API.
        value: code
      - key: EMAIL_FROM
        # Test sender: can send only to the Resend account owner's address.
        # Replace with a verified-domain sender before inviting other people.
        value: onboarding@resend.dev
      - key: RESEND_API_KEY
        sync: false
