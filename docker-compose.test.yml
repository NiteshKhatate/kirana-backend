name: kirana-backend-test
services:
  postgres-test:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kirana_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Run npm run db:test:setup first}
      POSTGRES_DB: kirana_identity_test
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - kirana_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kirana_test -d kirana_identity_test']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  kirana_test_data:
